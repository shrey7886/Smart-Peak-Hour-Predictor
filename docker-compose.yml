services:
  api:
    build: .
    container_name: smart-peak-hour-api-new
    command: uvicorn graphql_api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: unless-stopped

  streamlit:
    build: .
    container_name: smart-peak-hour-streamlit-new
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api
    restart: unless-stopped 